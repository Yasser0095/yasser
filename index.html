<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دردشة برو - مكالمات وبث</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
body{font-family:'Tajawal',sans-serif}
</style>
</head>
<body class="bg-[#0f0f0f] text-white h-screen flex flex-col">
<div class="flex h-full">
<!-- Login Screen -->
<div id="login" class="fixed inset-0 bg-[#0f0f0f] z-50 flex items-center justify-center">
  <div class="bg-zinc-900 p-8 rounded-[2rem] w-[90%] max-w-sm border border-zinc-800">
    <h1 class="text-3xl font-bold mb-2">مرحبا في دردشة 💬</h1>
    <p class="text-zinc-400 mb-6">سجل دخولك بالإيميل</p>
    <input id="email" placeholder="الإيميل" class="w-full p-3 rounded-xl bg-zinc-800 mb-3 outline-none"/>
    <input id="name" placeholder="اسمك" class="w-full p-3 rounded-xl bg-zinc-800 mb-3 outline-none"/>
    <input id="pass" type="password" placeholder="كلمة المرور" class="w-full p-3 rounded-xl bg-zinc-800 mb-6 outline-none"/>
    <button onclick="login()" class="w-full bg-white text-black p-3 rounded-xl font-bold">دخول</button>
  </div>
</div>

<!-- Sidebar -->
<div class="w-[360px] bg-zinc-900 border-l border-zinc-800 flex flex-col">
  <div class="p-4 flex gap-2">
    <button onclick="createGroup()" class="flex-1 bg-white text-black rounded-xl py-2 font-bold">+ مجموعة جديدة</button>
    <button onclick="startBroadcast()" class="bg-red-600 rounded-xl px-4 py-2">🔴 بث جماعي</button>
  </div>
  <div id="chats" class="flex-1 overflow-auto p-2 space-y-1"></div>
</div>

<!-- Chat -->
<div class="flex-1 flex flex-col">
  <div class="h-[64px] border-b border-zinc-800 flex items-center justify-between px-6">
    <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-gradient-to-br from-violet-500 to-pink-500"></div><div><div id="chatName" class="font-bold">اختر محادثة</div><div class="text-xs text-green-400">متصل</div></div></div>
    <div class="flex gap-2">
      <button onclick="startCall('voice')" class="w-10 h-10 rounded-full bg-zinc-800">🎤</button>
      <button onclick="startCall('video')" class="w-10 h-10 rounded-full bg-zinc-800">📹</button>
    </div>
  </div>
  <div id="messages" class="flex-1 overflow-auto p-6 space-y-3"></div>
  <div class="p-4 flex gap-2 border-t border-zinc-800">
    <input id="msgInput" placeholder="اكتب رسالة..." class="flex-1 bg-zinc-800 rounded-full px-5 py-3 outline-none"/>
    <button onclick="send()" class="bg-white text-black w-12 h-12 rounded-full font-bold">➤</button>
  </div>
</div>

<!-- Call Overlay -->
<div id="callOverlay" class="hidden fixed inset-0 bg-black/90 z-40 flex flex-col items-center justify-center">
  <video id="localVideo" autoplay muted class="w-64 h-48 bg-zinc-800 rounded-2xl absolute bottom-10 left-10"></video>
  <video id="remoteVideo" autoplay class="w-full h-full object-cover"></video>
  <div class="absolute bottom-10 flex gap-4"><button onclick="endCall()" class="bg-red-600 px-8 py-3 rounded-full">إنهاء</button></div>
  <div id="callStatus" class="absolute top-10 text-xl">جاري الاتصال...</div>
</div>

</div>
<script>
let socket, currentRoom=null, user=null;
function login(){
  user={email:document.getElementById('email').value, name:document.getElementById('name').value};
  if(!user.email||!user.name) return alert('اكمل البيانات');
  document.getElementById('login').style.display='none';
  initSocket();
  loadChats();
}
function initSocket(){
  socket=io();
  socket.on('receive_message', addMsg);
  socket.on('incoming_call', handleIncoming);
  socket.on('broadcast_started', ()=> alert('🔴 بدأ بث جماعي جديد!'));
}
let mockChats=[{id:'1',name:'فريق التصميم',avatar:'🎨',last:'تمام نشتغل عليه'},{id:'2',name:'أحمد',avatar:'👨',last:'وينك؟'},{id:'3',name:'مجموعة العائلة',avatar:'👨‍👩‍👧‍👦',last:'الغدا جاهز'}];
function loadChats(){
  const c=document.getElementById('chats');
  c.innerHTML=mockChats.map(ch=>`<div onclick="openChat('${ch.id}','${ch.name}')" class="p-3 rounded-2xl hover:bg-zinc-800 cursor-pointer flex gap-3"><div class="w-12 h-12 rounded-full bg-zinc-800 flex items-center justify-center text-xl">${ch.avatar}</div><div class="flex-1"><div class="font-bold">${ch.name}</div><div class="text-sm text-zinc-400">${ch.last}</div></div></div>`).join('');
}
function openChat(id,name){
  currentRoom=id; document.getElementById('chatName').innerText=name; socket.emit('join_room',id); document.getElementById('messages').innerHTML=`<div class="text-center text-zinc-500 text-sm">بدأت المحادثة مع ${name}</div>`;
}
function send(){
  const inp=document.getElementById('msgInput'); if(!inp.value||!currentRoom) return;
  const data={roomId:currentRoom, content:inp.value, sender:user.name, time:new Date().toLocaleTimeString()};
  socket.emit('send_message',data); addMsg(data); inp.value='';
}
function addMsg(d){
  const m=document.getElementById('messages'); const isMe=d.sender===user?.name;
  m.innerHTML+=`<div class="flex ${isMe?'justify-end':''}"><div class="${isMe?'bg-white text-black':'bg-zinc-800'} px-4 py-2 rounded-[1.2rem] max-w-[70%]">${d.content}</div></div>`; m.scrollTop=m.scrollHeight;
}
function createGroup(){
  const name=prompt('اسم المجموعة:'); if(!name) return;
  mockChats.unshift({id:Date.now().toString(),name,avatar:'👥',last:'تم إنشاء المجموعة'}); loadChats();
  fetch('/api/groups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,members:[],createdBy:user.email})});
}
let localStream;
async function startCall(type){
  document.getElementById('callOverlay').classList.remove('hidden');
  document.getElementById('callStatus').innerText= type==='video'?'مكالمة فيديو...':'مكالمة صوتية...';
  try{
    localStream=await navigator.mediaDevices.getUserMedia({video:type==='video',audio:true});
    document.getElementById('localVideo').srcObject=localStream;
  }catch(e){alert('الكاميرا/المايك غير متاح');}
}
function endCall(){
  document.getElementById('callOverlay').classList.add('hidden');
  if(localStream) localStream.getTracks().forEach(t=>t.stop());
  socket.emit('end_call',{to:currentRoom});
}
function handleIncoming({from, type}){ if(confirm(`مكالمة ${type} واردة، ترد؟`)) startCall(type); }
function startBroadcast(){
  if(!currentRoom) return alert('اختر مجموعة أولا');
  socket.emit('start_broadcast',{roomId:currentRoom,broadcasterId:user.email});
  startCall('video');
  alert('🔴 أنت الآن تبث مباشر لكل أعضاء الغرفة');
}
document.getElementById('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter') send()});
</script>
</body>
</html>
